# 도구 버전과 작업 실행의 단일 진입점. mise install -> mise run <task>.
[tools]
node = "22.16.0"
biome = "2.5.14"
rumdl = "0.3.2"
lefthook = "2.2.2"
"github:dyoshikawa/rulesync" = { version = "40.2.0", matching = "rulesync-", bin = "rulesync" }

[tasks]
deps = "npm ci"
test = "npm test"
typecheck = "npm run typecheck"
example = "npm run example"
"lint:md" = "rumdl check README.md AGENTS.md CHATBOT.md docs/ .inbox/ .agents/route/ .rulesync/rules/ .rulesync/skills/ .rulesync/subagents/ .github/pull_request_template.md"
"lint:code" = "biome lint src/ scripts/ tests/ examples/lighthouse/main.ts"
"format:md" = "rumdl fmt README.md AGENTS.md CHATBOT.md docs/ .inbox/ .agents/route/ .rulesync/rules/ .rulesync/skills/ .rulesync/subagents/ .github/pull_request_template.md"
"format:code" = "biome format --write src/ scripts/ tests/ examples/lighthouse/main.ts"
"routes:generate" = "node scripts/agent-route-index.mjs generate"
"routes:check" = "node scripts/agent-route-index.mjs check"
"routes:test" = "node --test tests/agent-route-index.test.mjs"
"inbox:test" = "node --test tests/inbox-harness.test.mjs"
"inbox:check" = "node scripts/check-inbox.mjs"
"hooks:install" = "lefthook install"
"hooks:validate" = "lefthook validate"
# resolve는 최초 잠금 생성/명시 갱신에만 사용. frozen은 기존 lock을 바꾸지 않습니다.
"rulesync:resolve" = "rulesync install"
"rulesync:install" = "rulesync install --frozen"
"rulesync:generate" = ["rulesync generate", "node scripts/agent-route-index.mjs generate"]
"rulesync:check" = "rulesync doctor --strict"

[tasks.check]
depends = ["lint:md", "lint:code", "hooks:validate", "routes:check", "routes:test", "inbox:test", "rulesync:check", "test", "typecheck"]
description = "변경 전 검증: rumdl, Biome, 라우팅·인박스 고유 계약, 런타임 테스트와 타입"
