# 도구 버전과 작업 실행의 단일 진입점. mise install -> mise run <task>.
[tools]
node = "22.16.0"
biome = "2.5.14"
rumdl = "0.3.2"
lefthook = "2.2.2"
"github:dyoshikawa/rulesync" = { version = "40.2.0", matching = "rulesync-", bin = "rulesync" }

[tasks]
deps = "npm ci"
test = "npm test"
typecheck = "npm run typecheck"
example = "npm run example"
"lint:md" = "rumdl check README.md AGENTS.md CHATBOT.md docs/ .inbox/ stdd/ .agents/route/ .rulesync/rules/ .rulesync/skills/ .rulesync/subagents/ .github/pull_request_template.md .github/ISSUE_TEMPLATE/ .github/templates/"
"lint:code" = "biome lint src/ scripts/ tests/ examples/lighthouse/main.ts"
"format:md" = "rumdl fmt README.md AGENTS.md CHATBOT.md docs/ .inbox/ stdd/ .agents/route/ .rulesync/rules/ .rulesync/skills/ .rulesync/subagents/ .github/pull_request_template.md .github/ISSUE_TEMPLATE/ .github/templates/"
"format:code" = "biome format --write src/ scripts/ tests/ examples/lighthouse/main.ts"
"routes:generate" = "node scripts/agent-route-index.mjs generate"
"routes:check" = "node scripts/agent-route-index.mjs check"
"routes:test" = "node --test tests/agent-route-index.test.mjs"
"inbox:test" = "node --test tests/inbox-harness.test.mjs"
"inbox:check" = "node scripts/check-inbox.mjs"
"docs:index" = "node scripts/generate-docs-index.mjs"
"docs:index:check" = "node scripts/generate-docs-index.mjs --check"
"hooks:install" = "lefthook install"
"hooks:validate" = "lefthook validate"
"rulesync:generate" = ["bash scripts/check-agent-cache.sh", "rulesync generate", "node scripts/agent-route-index.mjs generate"]
"rulesync:check" = ["bash scripts/check-agent-cache.sh", "rulesync doctor --strict"]
"rulesync:preview" = ["bash scripts/check-agent-cache.sh", "rulesync doctor --strict", "rulesync generate --dry-run"]

[tasks.check]
depends = ["lint:md", "lint:code", "hooks:validate", "routes:check", "routes:test", "inbox:test", "docs:index:check", "rulesync:check", "test", "typecheck"]
description = "변경 전 검증: rumdl, Biome, 라우팅·인박스·문서 인덱스 계약, 런타임 테스트와 타입"
