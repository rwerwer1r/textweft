name: Investigation / PoC
description: 구현 전에 중요한 불확실성을 좁은 실험으로 확인합니다.
title: "[Investigation] "
body:
  - type: markdown
    attributes:
      value: |
        관찰과 가설을 구분하고 실험 범위를 작게 유지합니다. Issue 생성은 실행·권한·외부 쓰기 승인이 아닙니다.
  - type: textarea
    id: question
    attributes:
      label: Question or decision
      description: 어떤 의사결정이 어떤 불확실성 때문에 막혀 있습니까?
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Verification plan and stop condition
      description: 가장 작은 안전한 실험, 필요한 증거, 중단 조건을 적습니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Known evidence and starting points
      description: 확인된 계약·경로·버전·관찰 결과를 적고 가설은 표시합니다.
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and risks
      description: 환경·계정·권한·비용·데이터 경계를 적습니다. 권한 전환을 추정하지 않습니다.
