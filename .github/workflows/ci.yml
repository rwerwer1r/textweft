name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Rulesync projection
        run: |
          bash scripts/check-agent-cache.sh
          npm exec --yes --package=rulesync@40.2.0 -- rulesync doctor --strict
          npm exec --yes --package=rulesync@40.2.0 -- rulesync generate
          node scripts/agent-route-index.mjs check
      - name: Test and typecheck
        run: |
          npm test
          npm run typecheck
