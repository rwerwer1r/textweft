name: P0 Harness Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: true
      - name: Install locked dependencies
        run: |
          test -f package-lock.json
          mise run rulesync:install
          npm ci
      - name: Generate agent projections
        run: mise exec -- rulesync generate
      - name: Verify repository contracts
        run: mise run check
