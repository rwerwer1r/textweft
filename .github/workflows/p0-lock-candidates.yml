name: P0 Lock Candidates

on:
  pull_request:
    paths:
      - ".github/workflows/p0-lock-candidates.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - name: Resolve npm lock without scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve pinned Rulesync sources
        run: mise run rulesync:resolve
      - uses: actions/upload-artifact@v4
        with:
          name: p0-lock-candidates
          path: |
            package-lock.json
            rulesync.lock
          retention-days: 3
          if-no-files-found: error
